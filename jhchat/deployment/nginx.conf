# 江湖聊天室 Nginx 配置文件
# 适用场景：生产环境反向代理
# 
# 使用方法：
# 1. cp nginx.conf /etc/nginx/sites-available/jhchat
# 2. ln -s /etc/nginx/sites-available/jhchat /etc/nginx/sites-enabled/
# 3. nginx -t
# 4. systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # 修改为实际域名
    
    # 访问日志
    access_log /var/log/nginx/jhchat_access.log;
    error_log /var/log/nginx/jhchat_error.log;
    
    # 客户端上传大小限制
    client_max_body_size 100M;
    
    # ==================== 前端代理 ====================
    location / {
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ==================== 后端 API 代理 ====================
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    
    # ==================== Socket.IO 代理 ====================
    # 用于 WebSocket 连接
    location /socket.io {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Socket.IO 需要这些设置
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        
        # 超时设置（WebSocket 长连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ==================== 静态资源代理 ====================
    # Vite 开发服务器的资源文件
    location /assets {
        proxy_pass http://localhost:5173;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=31536000";
    }
    
    location /public {
        proxy_pass http://localhost:5173;
    }
    
    # ==================== 上传文件代理 ====================
    # 访问后端上传的文件（头像等）
    location /uploads {
        proxy_pass http://localhost:3001;
        proxy_cache_valid 200 24h;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # ==================== SSL 配置（HTTPS） ====================
    # 如果启用 HTTPS，取消注释以下配置
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;
    # 
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # 
    # # HSTS
    # add_header Strict-Transport-Security "max-age=31536000" always;
}

